<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>백룸 모델 편집기</title>
<!-- 이 파일은 tools/build-model-editor.mjs 가 만든다. 직접 고치지 말고 tools/model-editor.template.html 을 고친 뒤 다시 만들 것 -->
<style>
  :root { --bg: #14120c; --panel: #1d1a12; --line: #3a3322; --text: #e6d9a8; --dim: #9a8c5c; --accent: #e7b92e; --danger: #d0503a; --ok: #6fbf5f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Malgun Gothic", sans-serif; overflow: hidden; }
  #app { display: grid; grid-template-columns: 250px 1fr 330px; grid-template-rows: auto 1fr; height: 100%; }
  header { grid-column: 1 / 4; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0 10px 0 0; color: var(--accent); }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 8px; }
  aside.right { border-right: 0; border-left: 1px solid var(--line); }
  #view { position: relative; overflow: hidden; }
  #view canvas { display: block; }
  #hint { position: absolute; left: 10px; bottom: 8px; color: var(--dim); font-size: 12px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #stats { position: absolute; right: 10px; top: 8px; color: var(--dim); font-size: 12px; pointer-events: none; text-align: right; }
  button, select, input, textarea { font: inherit; color: var(--text); background: #26221a; border: 1px solid var(--line); border-radius: 4px; }
  button { padding: 4px 9px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: #4a3c10; border-color: var(--accent); color: #fff3c4; font-weight: 600; }
  button.danger { border-color: #6a2a1e; }
  button.on { background: #3a3218; border-color: var(--accent); }
  select, input { padding: 3px 5px; }
  input[type=number] { width: 64px; }
  input[type=color] { width: 40px; height: 24px; padding: 0 2px; }
  textarea { width: 100%; resize: vertical; padding: 5px; min-height: 54px; }
  h2 { font-size: 12px; color: var(--accent); margin: 12px 0 6px; text-transform: none; letter-spacing: 0.02em; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  h2:first-child { margin-top: 0; }
  .row { display: flex; gap: 5px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
  .row label { color: var(--dim); min-width: 52px; }
  .vec input { width: 60px; }
  #parts { list-style: none; margin: 0; padding: 0; }
  #parts li { padding: 2px 6px; border-radius: 3px; cursor: pointer; display: flex; justify-content: space-between; gap: 4px; white-space: nowrap; }
  #parts li:hover { background: #2a2518; }
  #parts li.sel { background: #4a3c10; color: #fff3c4; }
  #parts li .g { color: var(--dim); font-size: 11px; }
  #parts li.noted::after { content: '✎'; color: var(--accent); margin-left: 4px; }
  #parts li.changed .n { color: #9fd58f; }
  #parts li.added .n { color: #8fc8ff; }
  .groupHead { color: var(--dim); font-size: 11px; margin: 6px 0 2px; }
  .mat { display: flex; gap: 6px; align-items: center; margin: 3px 0; }
  .mat span { flex: 1; }
  .tag { font-size: 10px; color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
  .muted { color: var(--dim); font-size: 12px; }
  #toast { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); background: #2d4a1e; color: #e8ffd8; padding: 7px 14px; border-radius: 5px; display: none; z-index: 9; box-shadow: 0 4px 16px #000a; }
  #toast.err { background: #5a2018; color: #ffe0d8; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--accent); border-radius: 6px; width: min(720px, 92vw); }
  dialog textarea { min-height: 300px; font: 12px/1.35 ui-monospace, Consolas, monospace; }
  .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

} }

</head>
<body>
<div id="app">
  <header>
    <h1>백룸 모델 편집기</h1>
    <select id="modelSel" title="고칠 모델"></select>
    <span class="sep"></span>
    <button id="btnWalk" title="걷는 모습 보기">걷기</button>
    <button id="btnSeed" title="chance(확률) 부품이 다르게 붙은 모습">다른 모습</button>
    <button id="btnLight" title="밝게 보기 / 게임처럼 어둡게">밝게 보기</button>
    <button id="btnRef" class="on" title="키 1.75m 기준 막대와 바닥 격자">기준선</button>
    <span class="sep"></span>
    <button id="btnUndo" title="되돌리기 (Ctrl+Z)">↶ 되돌리기</button>
    <button id="btnRedo" title="다시 하기 (Ctrl+Y)">↷</button>
    <span class="sep"></span>
    <button id="btnCopy" class="primary" title="고친 점 + 메모를 복사 → Claude 에게 붙여 넣기">Claude에게 줄 내용 복사</button>
    <button id="btnSave" title="전체 모델 데이터를 .json 파일로 저장">파일로 저장</button>
    <button id="btnLoad" title=".json 파일 불러오기">불러오기</button>
    <input id="fileIn" type="file" accept=".json,application/json" hidden>
    <button id="btnReset" class="danger" title="모든 수정을 버리고 처음 상태로">처음 상태로</button>
  </header>

  <aside>
    <h2>부품 <span class="muted" id="partCount"></span></h2>
    <div class="row"><input id="search" placeholder="부품 이름 찾기" style="width:100%"></div>
    <div class="row">
      <button id="btnAdd" title="새 부품 추가 (선택한 부품 옆에)">+ 추가</button>
      <button id="btnDup" title="복제 (Ctrl+D)">복제</button>
      <button id="btnMirror" title="좌우 반대쪽에 대칭 복제">좌우 대칭</button>
      <button id="btnDel" class="danger" title="삭제 (Delete)">삭제</button>
    </div>
    <ul id="parts"></ul>
  </aside>

  <div id="view">
    <div id="stats"></div>
    <div id="hint">왼쪽 드래그: 돌려 보기 · 오른쪽 드래그: 옮기기 · 휠: 확대 · 부품 클릭: 선택 · W/E/R: 이동/회전/크기 손잡이 · Esc: 선택 해제</div>
  </div>

  <aside class="right">
    <div id="partPanel"></div>
    <h2>재질 (색)</h2>
    <div id="mats"></div>
    <h2>모델</h2>
    <div id="modelPanel"></div>
    <h2>메모 — 수정할 점</h2>
    <div class="muted">여기 적은 내용도 "Claude에게 줄 내용 복사"에 같이 들어간다.</div>
    <label class="muted">이 모델 전체</label>
    <textarea id="noteModel" placeholder="예: 하울러 팔이 너무 길다, 머리를 더 길쭉하게…"></textarea>
    <label class="muted">전체 (모든 모델)</label>
    <textarea id="noteAll" placeholder="예: 전체적으로 더 기괴하게, 색을 더 어둡게…"></textarea>
  </aside>
</div>
<div id="toast"></div>
<dialog id="copyDlg">
  <div class="row" style="justify-content:space-between"><b>Claude 에게 붙여 넣을 내용</b><button id="dlgClose">닫기</button></div>
  <div class="muted">자동 복사가 막혔으면 아래를 전부 선택(Ctrl+A)해서 복사(Ctrl+C)하세요.</div>
  <textarea id="dlgText" readonly></textarea>
</dialog>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

// ---------------------------------------------------------------- 게임과 같은 모델 빌더 (game/client/three/models/build.js)
const BUILD_SRC = "/**\r\n * 데이터(부품 목록)로 3D 모델을 짓는다. 게임(actors.js)과 모델 편집기(tools/model-editor.html)가 같은 코드를 쓴다.\r\n *  - three 는 인자로 받는다 (편집기는 CDN 의 three, 게임은 번들의 three)\r\n *  - 이 파일은 import 가 없어야 한다 (편집기 HTML 에 그대로 끼워 넣는다 — tools/build-model-editor.mjs)\r\n *\r\n * 모델 데이터 (game/client/three/models/level0.json):\r\n *  {\r\n *    name, height(m), kind,\r\n *    pivots: { torso: [x,y,z], head: [...], armL, armR, legL, legR }   // 회전축 (서 있는 자세, 모델 기준 좌표). -z 가 앞\r\n *    materials: { 이름: { color: '#hex', emissive?: '#hex', glow?: true, tint?: true } }\r\n *       glow: 빛나는 재질 (안개·조명 무시, 눈 등) / tint: 플레이어 옷 색으로 바뀌는 재질\r\n *    pose?: { torsoLean: 앞으로 숙임(°), headTilt: 고개 숙임(°) }\r\n *    parts: [{ id, shape, size, pos, rot?, scale?, mat, color?, in?, chance?, note? }]\r\n *       shape: box [w,h,d] / sphere [r] / capsule [r, 길이] / cylinder [위r, 아래r, 높이] / cone [r, 높이] / torus [R, 굵기]\r\n *       pos: 서 있는 자세의 모델 기준 좌표(m), rot: 도(°) [x,y,z], scale: [x,y,z]\r\n *       in: 붙는 부위 (root | torso | head | armL | armR | legL | legR) — 그 부위가 걸을 때 같이 움직인다\r\n *       chance: 0..1 — 이 확률로만 붙는다 (같은 시드면 같은 모습). 생김새를 다양하게\r\n *  }\r\n */\r\n\r\n/** 시드 난수 (mulberry32) */\r\nexport function seededRandom(seed) {\r\n  let a = (seed >>> 0) || 1;\r\n  return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };\r\n}\r\n/** 문자열 → 시드 */\r\nexport function seedOf(s) { let h = 2166136261; for (const c of String(s ?? '')) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }\r\n\r\nconst GROUP_PARENT = { torso: 'root', legL: 'root', legR: 'root', head: 'torso', armL: 'torso', armR: 'torso' };\r\nexport const GROUPS = ['root', 'torso', 'head', 'armL', 'armR', 'legL', 'legR'];\r\n\r\n/** 부품 하나의 지오메트리 */\r\nexport function partGeometry(THREE, p) {\r\n  const s = p.size || [0.1, 0.1, 0.1];\r\n  switch (p.shape) {\r\n    case 'sphere': return new THREE.SphereGeometry(s[0], 12, 9);\r\n    case 'capsule': return new THREE.CapsuleGeometry(s[0], s[1] ?? 0.1, 4, 10);\r\n    case 'cylinder': return new THREE.CylinderGeometry(s[0], s[1] ?? s[0], s[2] ?? 0.1, 12);\r\n    case 'cone': return new THREE.ConeGeometry(s[0], s[1] ?? 0.1, 10);\r\n    case 'torus': return new THREE.TorusGeometry(s[0], s[1] ?? 0.02, 8, 18);\r\n    default: return new THREE.BoxGeometry(s[0], s[1] ?? s[0], s[2] ?? s[0]);\r\n  }\r\n}\r\n\r\n/** 색 문자열을 밝기·채도 조정 (faded: 빛바램) */\r\nfunction adjustColor(THREE, hex, faded) {\r\n  const c = new THREE.Color(hex);\r\n  if (faded) { const hsl = {}; c.getHSL(hsl); c.setHSL(hsl.h, hsl.s * 0.45, hsl.l * 0.75); }\r\n  return c;\r\n}\r\n\r\n/**\r\n * 모델 짓기.\r\n * opts: {\r\n *   tint: '#hex'   — tint 재질(옷)의 색 (플레이어 색)\r\n *   faded: bool    — 모든 색을 빛바래게 (방랑자)\r\n *   seed: number   — chance 부품 고르기\r\n *   merge: bool    — 부위·재질별로 메시를 하나로 합친다 (게임용, 그리기 호출 수 줄이기). 편집기는 false (부품을 골라야 하므로)\r\n *   mergeGeometries: fn — three/examples BufferGeometryUtils.mergeGeometries (merge 일 때 필요)\r\n *   Material: 재질 클래스 (기본 MeshLambertMaterial)\r\n * }\r\n * 반환: THREE.Group. userData = { limbs: { armL, armR, legL, legR }, torso, head, eyes, eyeMat, height, kind, parts: [mesh...] }\r\n */\r\nexport function buildModel(THREE, spec, opts = {}) {\r\n  const rng = seededRandom(opts.seed ?? 1);\r\n  const Mat = opts.Material || THREE.MeshLambertMaterial;\r\n  const root = new THREE.Group();\r\n  root.name = spec.name || 'model';\r\n  const pv = spec.pivots || {};\r\n  const abs = g => (g === 'root' ? [0, 0, 0] : pv[g] || [0, 0, 0]);\r\n  // 부위 그룹: 회전축 위치에 두고, 부모 그룹 기준 상대 좌표로\r\n  const groups = { root };\r\n  for (const g of GROUPS.slice(1)) {\r\n    const grp = new THREE.Group(); grp.name = g;\r\n    groups[g] = grp;\r\n  }\r\n  for (const g of GROUPS.slice(1)) {\r\n    const parent = GROUP_PARENT[g], a = abs(g), pa = abs(parent);\r\n    groups[g].position.set(a[0] - pa[0], a[1] - pa[1], a[2] - pa[2]);\r\n    groups[parent].add(groups[g]);\r\n  }\r\n  // 재질 (모델 하나 안에서 공유)\r\n  const mats = {};\r\n  let eyeMat = null;\r\n  const matFor = (name, override) => {\r\n    const key = `${name}|${override || ''}`;\r\n    if (mats[key]) return mats[key];\r\n    const d = (spec.materials || {})[name] || { color: '#888888' };\r\n    const hex = override || (d.tint && opts.tint ? opts.tint : d.color);\r\n    let m;\r\n    if (d.glow) { m = new THREE.MeshBasicMaterial({ color: new THREE.Color(hex), fog: false }); if (!eyeMat) eyeMat = m; }\r\n    else {\r\n      m = new Mat({ color: adjustColor(THREE, hex, opts.faded) });\r\n      if (d.emissive && m.emissive) m.emissive = new THREE.Color(d.emissive);\r\n    }\r\n    m.userData.matName = name;\r\n    if (d.glow) m.userData.glow = true;\r\n    mats[key] = m;\r\n    return m;\r\n  };\r\n  const meshes = [];\r\n  const eyes = new THREE.Group(); eyes.name = 'eyes';\r\n  for (const p of spec.parts || []) {\r\n    if (p.chance !== undefined && p.chance < 1 && rng() >= p.chance) continue;\r\n    const g = groups[p.in] ? p.in : 'root';\r\n    const geo = partGeometry(THREE, p);\r\n    const mat = matFor(p.mat, p.color);\r\n    const m = new THREE.Mesh(geo, mat);\r\n    const a = abs(g), pos = p.pos || [0, 0, 0];\r\n    m.position.set(pos[0] - a[0], pos[1] - a[1], pos[2] - a[2]);\r\n    if (p.rot) m.rotation.set(p.rot[0] * Math.PI / 180, (p.rot[1] || 0) * Math.PI / 180, (p.rot[2] || 0) * Math.PI / 180);\r\n    if (p.scale) m.scale.set(p.scale[0], p.scale[1] ?? p.scale[0], p.scale[2] ?? p.scale[0]);\r\n    m.userData.part = p;\r\n    m.name = p.id || '';\r\n    groups[g].add(m);\r\n    meshes.push(m);\r\n  }\r\n  if (opts.merge && opts.mergeGeometries) mergeGroups(THREE, groups, opts.mergeGeometries);\r\n  // 기본 자세 (pose: { torsoLean: 앞으로 숙임 °, headTilt: 고개 숙임 ° }) — 방랑자처럼 구부정한 모델\r\n  const pose = spec.pose || {};\r\n  groups.torso.rotation.x = -(pose.torsoLean || 0) * Math.PI / 180;\r\n  groups.head.rotation.x = -(pose.headTilt || 0) * Math.PI / 180;\r\n  groups.torso.userData.baseLean = groups.torso.rotation.x;\r\n  // 빛나는 재질 부품(눈)은 eyes 로 모은다 (게임이 쫓을 때 눈 색을 바꾼다)\r\n  root.userData = {\r\n    limbs: { armL: groups.armL, armR: groups.armR, legL: groups.legL, legR: groups.legR },\r\n    torso: groups.torso, head: groups.head, eyes, eyeMat,\r\n    height: spec.height || 1.75, kind: spec.kind || spec.name, parts: meshes, groups,\r\n  };\r\n  return root;\r\n}\r\n\r\n/** 부위마다 같은 재질의 메시를 하나로 합친다 (부품 수백 개 → 그리기 호출 수십 개) */\r\nfunction mergeGroups(THREE, groups, mergeGeometries) {\r\n  for (const grp of Object.values(groups)) {\r\n    const byMat = new Map();\r\n    for (const c of [...grp.children]) {\r\n      if (!c.isMesh) continue;\r\n      if (!byMat.has(c.material)) byMat.set(c.material, []);\r\n      byMat.get(c.material).push(c);\r\n    }\r\n    for (const [mat, list] of byMat) {\r\n      if (list.length < 2) continue;\r\n      const geos = list.map(m => {\r\n        m.updateMatrix();\r\n        const g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();\r\n        g.applyMatrix4(m.matrix);\r\n        for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);\r\n        return g;\r\n      });\r\n      const merged = mergeGeometries(geos, false);\r\n      for (const g of geos) g.dispose();\r\n      if (!merged) continue;\r\n      for (const m of list) { grp.remove(m); m.geometry.dispose(); }\r\n      const mm = new THREE.Mesh(merged, mat);\r\n      mm.name = `${grp.name}:${mat.userData.matName || ''}`;\r\n      grp.add(mm);\r\n    }\r\n  }\r\n}\r\n\r\n/** 걷기 자세: 팔다리 흔들기. speed 0..1, crouch 면 낮게 */\r\nexport function poseWalk(group, phase, speed, crouch = false) {\r\n  const L = group.userData.limbs; if (!L) return;\r\n  const s = Math.sin(phase) * 0.7 * speed;\r\n  L.legL.rotation.x = s; L.legR.rotation.x = -s;\r\n  L.armL.rotation.x = -s * 0.8; L.armR.rotation.x = s * 0.8;\r\n  group.scale.y = crouch ? 0.65 : 1;\r\n}\r\n";
const B = await import(URL.createObjectURL(new Blob([BUILD_SRC], { type: 'text/javascript' })));
// 처음 상태 (game/client/three/models/level0.json)

  const box = $('modelPanel'), sp = spec(); box.innerHTML = '';
  let row = document.createElement('div'); row.className = 'row';
  const l = document.createElement('label'); l.textContent = '키(m)'; row.append(l, numInput(sp.height, 0.05, v => { sp.height = v; save(); rebuild(); })); box.append(row);
  const pose = sp.pose || {};
  const setPose = (k, v) => { sp.pose = { ...(sp.pose || {}), [k]: v }; if (!sp.pose.torsoLean && !sp.pose.headTilt) delete sp.pose; save(); rebuild(); };
  row = document.createElement('div'); row.className = 'row';
  const l2 = document.createElement('label'); l2.textContent = '숙임(°)';
  row.append(l2, numInput(pose.torsoLean || 0, 1, v => setPose('torsoLean', v), '54px'));
  const l3 = document.createElement('label'); l3.textContent = '고개(°)';
  row.append(l3, numInput(pose.headTilt || 0, 1, v => setPose('headTilt', v), '54px'));
  box.append(row);
  const hp = document.createElement('div'); hp.className = 'muted'; hp.textContent = '회전축 (걸을 때 팔다리가 도는 점, 서 있는 자세 기준 좌표)'; box.append(hp);
  for (const g of B.GROUPS.slice(1)) {
    sp.pivots[g] ||= [0, 0, 0];
    box.append(vecRow(GROUP_KO[g], sp.pivots[g], 3, 0.01, () => { save(); rebuild(); }, ['x', 'y', 'z']));
  }
}

// ---------------------------------------------------------------- 편집 동작
function uniqueId(base) { const ids = new Set(spec().parts.map(p => p.id)); let i = 1, id = base; while (ids.has(id)) id = `${base}${++i}`; return id; }
$('btnAdd').onclick = () => {
  snapshot();
  const sp = spec(), ref = sp.parts[sel];
  const p = { id: uniqueId('new'), shape: 'box', size: [0.05, 0.05, 0.05], pos: ref ? [ref.pos[0] + 0.06, ref.pos[1], ref.pos[2]] : [0, 1, 0], mat: ref?.mat || Object.keys(sp.materials)[0], in: ref?.in || 'root' };
  sp.parts.push(p); sel = sp.parts.length - 1; commit(); attachSel();
};
$('btnDup').onclick = () => {
  const sp = spec(), p = sp.parts[sel]; if (!p) return;
  snapshot(); const c = clone(p); c.id = uniqueId(p.id.replace(/\d+$/, '') || p.id); c.pos = [c.pos[0] + 0.03, c.pos[1], c.pos[2]];
  sp.parts.splice(sel + 1, 0, c); sel++; commit(); attachSel();
};
$('btnMirror').onclick = () => {
  const sp = spec(), p = sp.parts[sel]; if (!p) return;
  snapshot(); const c = clone(p);
  const swap = s => s.replace(/L(?=\d*_?\d*$)/, '\u0000').replace(/R(?=\d*_?\d*$)/, 'L').replace('\u0000', 'R');
  c.id = uniqueId(swap(p.id) === p.id ? `${p.id}M` : swap(p.id));
  c.pos = [-c.pos[0], c.pos[1], c.pos[2]];
  if (c.rot) c.rot = [c.rot[0], -c.rot[1], -c.rot[2]];
  if (c.in === 'armL' || c.in === 'armR' || c.in === 'legL' || c.in === 'legR') c.in = c.in.endsWith('L') ? c.in.slice(0, -1) + 'R' : c.in.slice(0, -1) + 'L';
  sp.parts.splice(sel + 1, 0, c); sel++; commit(); attachSel();
};
$('btnDel').onclick = () => {
  const sp = spec(); if (sel < 0) return;
  snapshot(); sp.parts.splice(sel, 1); sel = Math.min(sel, sp.parts.length - 1); commit(); attachSel();
};
function doUndo() { if (!undo.length) return; redo.push(JSON.stringify(S.data)); S.data = JSON.parse(undo.pop()); sel = Math.min(sel, spec().parts.length - 1); commit(); }
function doRedo() { if (!redo.length) return; undo.push(JSON.stringify(S.data)); S.data = JSON.parse(redo.pop()); commit(); }
$('btnUndo').onclick = doUndo; $('btnRedo').onclick = doRedo;
addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y' && !typing) { e.preventDefault(); doRedo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd' && !typing) { e.preventDefault(); $('btnDup').click(); }
  else if (typing) return;
  else if (e.key === 'Delete') $('btnDel').click();
  else if (e.key === 'Escape') select(-1);
  else if (e.key === 'w' || e.key === 'W') gizmo.setMode('translate');
  else if (e.key === 'e' || e.key === 'E') gizmo.setMode('rotate');
  else if (e.key === 'r' || e.key === 'R') gizmo.setMode('scale');
});
$('search').oninput = renderLists;
$('noteModel').oninput = e => { S.notes.models[S.model] = e.target.value; save(); };
$('noteAll').oninput = e => { S.notes.all = e.target.value; save(); };
$('btnWalk').onclick = () => { walking = !walking; $('btnWalk').classList.toggle('on', walking); if (!walking) rebuild(); };
$('btnSeed').onclick = () => { seed = (seed % 9999) + 1; rebuild(); };
$('btnLight').onclick = () => { bright = !bright; applyLight(); };
$('btnRef').onclick = () => { showRef = !showRef; refGroup.visible = showRef; $('btnRef').classList.toggle('on', showRef); };

// 모델 고르기
const ms = $('modelSel');
for (const k of Object.keys(S.data.models)) { const o = document.createElement('option'); o.value = k; o.textContent = MODEL_KO[k] || k; ms.append(o); }
ms.value = S.model;
ms.onchange = () => { S.model = ms.value; sel = -1; save(); rebuild(); renderLists(); frame(); };
function frame() { const h = spec().height || 1.75; orbit.target.set(0, h * 0.55, 0); camera.position.set(h * 0.9, h * 0.85, -h * 1.45); }

// ---------------------------------------------------------------- 내보내기: Claude 에게 줄 내용
/** 처음 상태와 비교한 바뀐 점 (부품은 이름으로 비교) */
function diff() {
  const out = {};
  for (const [name, m] of Object.entries(S.data.models)) {
    const b = BASE.models[name], d = {};
    if (!b) { out[name] = { newModel: m }; continue; }
    for (const k of ['height', 'pose', 'pivots']) if (JSON.stringify(m[k] ?? null) !== JSON.stringify(b[k] ?? null)) d[k] = m[k];
    const mats = {};
    for (const [k, v] of Object.entries(m.materials)) if (JSON.stringify(v) !== JSON.stringify(b.materials[k])) mats[k] = v;
    if (Object.keys(mats).length) d.materials = mats;
    const bp = new Map(b.parts.map(p => [p.id, p])), mp = new Map(m.parts.map(p => [p.id, p]));
    const changed = [], added = [], removed = [];
    for (const p of m.parts) { const o = bp.get(p.id); if (!o) added.push(p); else if (JSON.stringify(o) !== JSON.stringify(p)) changed.push(p); }
    for (const p of b.parts) if (!mp.has(p.id)) removed.push(p.id);
    if (changed.length) d.changed = changed;
    if (added.length) d.added = added;
    if (removed.length) d.removed = removed;
    if (Object.keys(d).length) out[name] = d;
  }
  return out;
}
function exportText() {
  const N = S.notes, lines = ['[백룸 모델 편집 결과]', `기준: level0.json ${BASE_STAMP}`, ''];
  if (N.all?.trim()) lines.push('■ 전체 메모', N.all.trim(), '');
  for (const name of Object.keys(S.data.models)) {
    const mn = N.models[name]?.trim(), pn = Object.entries(N.parts[name] || {}).filter(([, v]) => v.trim());
    if (!mn && !pn.length) continue;
    lines.push(`■ ${MODEL_KO[name] || name} (${name})`);
    if (mn) lines.push(mn);
    for (const [id, v] of pn) lines.push(`  - 부품 ${id}: ${v.trim()}`);
    lines.push('');
  }
  const d = diff();
  lines.push(Object.keys(d).length ? '■ 직접 고친 데이터 (처음 상태와 다른 것만)' : '■ 직접 고친 데이터: 없음');
  if (Object.keys(d).length) lines.push('```json', JSON.stringify(d), '```');
  return lines.join('\n');
}
$('btnCopy').onclick = async () => {
  const text = exportText();
  try { await navigator.clipboard.writeText(text); toast(`복사했다 (${Math.round(text.length / 1024 * 10) / 10}KB) — Claude 에게 붙여 넣으세요`); }
  catch { $('dlgText').value = text; $('copyDlg').showModal(); $('dlgText').select(); }
};
$('dlgClose').onclick = () => $('copyDlg').close();
$('btnSave').onclick = () => {
  const blob = new Blob([JSON.stringify({ ...S.data, notes: S.notes, stamp: BASE_STAMP }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'backrooms-models.json'; a.click();
  toast('backrooms-models.json 으로 저장했다 (다운로드 폴더). 이 파일 위치를 Claude 에게 알려 줘도 된다');
};
$('btnLoad').onclick = () => $('fileIn').click();
$('fileIn').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!j.models) throw new Error('models 가 없다');
    snapshot();
    S.data = { version: j.version || 1, models: j.models };
    if (j.notes) S.notes = j.notes;
    if (!S.data.models[S.model]) S.model = Object.keys(S.data.models)[0];
    sel = -1; commit(); toast('불러왔다');
  } catch (err) { toast(`불러오기 실패: ${err.message}`, true); }
  e.target.value = '';
};
$('btnReset').onclick = () => {
  if (!confirm('모든 수정과 메모를 버리고 처음 상태로 돌아갈까요? (되돌리기로 한 번 복구할 수 있다)')) return;
  snapshot(); const keep = S.model; S = freshState(); S.model = keep; sel = -1; commit();
};
let toastT = 0;
function toast(msg, err) { const el = $('toast'); el.textContent = msg; el.className = err ? 'err' : ''; el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => { el.style.display = 'none'; }, 3200); }

applyLight(); resize(); rebuild(); renderLists(); frame();
window.__editor = { S, spec, select, exportText, rebuild };   // 자동 확인용
</script>
</body>
